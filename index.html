<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#9e7f60" />
    <title>Clínica Girlane Ferreira</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f5f1ec;
        color: #3f342d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(34rem, 100%);
        padding: 3rem 2rem;
        border: 1px solid #dfd7cc;
        border-radius: 1.5rem;
        background: rgba(255, 255, 255, 0.72);
        text-align: center;
        box-shadow: 0 1rem 3rem rgba(63, 52, 45, 0.08);
      }

      p {
        margin: 0 0 0.75rem;
        color: #9e7f60;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.35rem);
        font-weight: 400;
        line-height: 1.05;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Você no centro. Sempre.</p>
      <h1>Clínica Girlane Ferreira</h1>
    </main>
  </body>
</html>
